# cargo-deny config: advisories / bans / licenses / sources
# https://embarkstudios.github.io/cargo-deny/

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Unicode-3.0",
    "BSL-1.0",    # xxhash-rust (bloom filters)
]
confidence-threshold = 0.8

[licenses.private]
# Workspace crates are BUSL-1.1 + publish=false — this check is about
# third-party dependencies, not our own code.
ignore = true

[bans]
multiple-versions = "warn"
highlight = "all"

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
